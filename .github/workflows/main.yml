name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Restore dependencies
        run: dotnet restore PeepingCat/PeepingCat.csproj

      - name: Build
        run: dotnet build PeepingCat/PeepingCat.csproj --no-restore /p:Configuration=Release /p:DefineConstants=XL_NOAUTOUPDATE

      - name: Package
        shell: pwsh
        run: |
          # locate the Release output folder instead of hardcoding it
          $dll = Get-ChildItem -Path PeepingCat\bin -Recurse -Filter PeepingCat.dll |
                 Where-Object { $_.FullName -match 'Release' } |
                 Select-Object -First 1
          if (-not $dll) { throw "PeepingCat.dll not found in a Release output folder" }
          $out = $dll.DirectoryName

          $files = @("PeepingCat.dll", "PeepingCat.json", "PeepingCat.pdb", "assets") |
                   ForEach-Object { Join-Path $out $_ } |
                   Where-Object { Test-Path $_ }

          New-Item -ItemType Directory -Force -Path bin\Package | Out-Null
          Compress-Archive -Path $files -DestinationPath bin\Package\PeepingCat.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeepingCat
          path: bin\Package\PeepingCat.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin\Package\PeepingCat.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true